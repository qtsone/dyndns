apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dyndns.fullname" . }}-config
  labels:
    {{- include "dyndns.labels" . | nindent 4 }}
data:
  CLOUDFLARE_ZONE_ID: {{ .Values.config.cloudflareZoneId | quote }}
  DNS_RECORDS: {{ .Values.config.dnsRecords | quote }}
  PROXIED: {{ .Values.config.proxied | quote }}
  PROVIDER: {{ .Values.config.provider | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }} 
