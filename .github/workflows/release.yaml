name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'src/**'
      - 'helm/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Semantic Release
        id: semantic
        uses: qts-cloud/actions/release@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Checkout
        if: ${{ steps.semantic.outputs.new_release_published }}
        uses: actions/checkout@v4

      - name: Configure Git
        if: ${{ steps.semantic.outputs.new_release_published }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        if: ${{ steps.semantic.outputs.new_release_published }}
        uses: azure/setup-helm@v4
        with:
          version: v3.12.2
      
      - name: Install GitHub CLI
        if: ${{ steps.semantic.outputs.new_release_published }}
        run: .github/scripts/install_gh.sh v2.48.0

      - name: Install YQ
        if: ${{ steps.semantic.outputs.new_release_published }}
        run: .github/scripts/install_yq.sh v4.44.1

      - name: Release Helm Package
        if: ${{ steps.semantic.outputs.new_release_published }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: "${{ github.actor }}"
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          CHART_PATH: helm/dyndns
        run: bash .github/scripts/release.sh
